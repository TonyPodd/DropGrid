x-backend: &backend
  image: dropgrid-backend:local
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    args:
      INSTALL_VISUAL: ${INSTALL_VISUAL:-false}
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    APP_SECRET_KEY: ${APP_SECRET_KEY:-}
    DATABASE_URL: postgresql+asyncpg://dropgrid:dropgrid@postgres:5432/dropgrid
    BACKEND_HOST: 0.0.0.0
    BACKEND_PORT: 8000
    BACKEND_URL: http://api:8000
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropgrid
      POSTGRES_PASSWORD: dropgrid
      POSTGRES_DB: dropgrid
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropgrid -d dropgrid"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment: &photo-env
      <<: *backend-env
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_TIMEOUT_SECONDS: ${VK_TIMEOUT_SECONDS:-10}
      VK_UPLOAD_TIMEOUT_SECONDS: ${VK_UPLOAD_TIMEOUT_SECONDS:-30}
      VK_MAX_ATTEMPTS: ${VK_MAX_ATTEMPTS:-3}
      VK_MIN_INTERVAL_SECONDS: ${VK_MIN_INTERVAL_SECONDS:-1}
      VK_MAX_PHOTO_BYTES: ${VK_MAX_PHOTO_BYTES:-10485760}
      VK_WRITE_ENABLED: ${VK_WRITE_ENABLED:-false}
      VK_SEND_INTERVAL_SECONDS: ${VK_SEND_INTERVAL_SECONDS:-60}
      VK_TEST_ALLOWED_COMMUNITY_IDS: ${VK_TEST_ALLOWED_COMMUNITY_IDS:-}
      VK_TEST_ACCOUNT_ID: ${VK_TEST_ACCOUNT_ID:-}
      VK_TEST_ACCESS_TOKEN: ${VK_TEST_ACCESS_TOKEN:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      MEDIA_STORAGE_DIR: /app/media
      VISUAL_EMBEDDING_ENABLED: ${VISUAL_EMBEDDING_ENABLED:-false}
      VISUAL_MODEL_PATH: ${VISUAL_MODEL_PATH:-/app/media/models/clip-vision-int8.onnx}
      PHOTO_MAX_REUSE_PER_ASSET: ${PHOTO_MAX_REUSE_PER_ASSET:-3}
      PHOTO_SEARCH_CACHE_HOURS: ${PHOTO_SEARCH_CACHE_HOURS:-24}
      PHOTO_DOWNLOAD_CONCURRENCY: ${PHOTO_DOWNLOAD_CONCURRENCY:-4}
      PHOTO_DOWNLOAD_SPARE: ${PHOTO_DOWNLOAD_SPARE:-3}
      PHOTO_DOWNLOAD_TIMEOUT_SECONDS: ${PHOTO_DOWNLOAD_TIMEOUT_SECONDS:-10}
      CAMPAIGN_REFERENCE_WARMUP_TARGET: ${CAMPAIGN_REFERENCE_WARMUP_TARGET:-12}
      CAMPAIGN_REFERENCE_RECENT_DAYS: ${CAMPAIGN_REFERENCE_RECENT_DAYS:-180}
      MEDIA_PREPARATION_CONCURRENCY: ${MEDIA_PREPARATION_CONCURRENCY:-2}
      VK_READ_CONCURRENCY: ${VK_READ_CONCURRENCY:-1}
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 15

  worker:
    <<: *backend
    command: ["python", "-m", "dropgrid.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  sender:
    <<: *backend
    profiles: ["sender"]
    command: ["python", "-m", "dropgrid.worker.sender"]
    environment:
      <<: *photo-env
      VK_TEST_ACCESS_TOKEN: ""
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  media-preparation:
    <<: *backend
    profiles: ["media-preparation"]
    command: ["python", "-m", "dropgrid.photos.preparation_worker"]
    environment:
      <<: *photo-env
      # This worker is read-only even when another diagnostic enables writes.
      VK_WRITE_ENABLED: "false"
      VK_TEST_ACCESS_TOKEN: ""
      VK_TEST_ALLOWED_COMMUNITY_IDS: ""
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *backend
    profiles: ["bot"]
    command: ["python", "-m", "dropgrid.bot"]
    environment:
      <<: *backend-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
